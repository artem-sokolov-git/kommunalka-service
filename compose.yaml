x-app: &app
  build: .
  image: kommunalka-service
  volumes:
    # The database is a plain file on the host: ./data/kommunalka.db
    - ./data:/data

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    ports:
      - "${KOMMUNALKA_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    <<: *app
    # A copy on start, then daily; the 30 newest are kept in ./data/backups.
    command:
      - python
      - -m
      - kommunalka.infrastructure.db.backup
      - /data/kommunalka.db
      - /data/backups
      - --every=86400
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
