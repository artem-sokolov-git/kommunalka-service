{% macro icon(kind) %}
<span class="icon {{ kind }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if kind == "gas" %}<path d="M12 3c1 3 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 0 2 1 3 2.5 3 0-3-1-5 0-8z"/>
  {%- elif kind == "power" %}<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
  {%- else %}<path d="M3 8h11a4 4 0 0 1 4 4v9"/><path d="M3 14h7a2 2 0 0 1 2 2v5"/>
  {%- endif -%}
</svg></span>
{%- endmacro %}

{% macro check() -%}
<span class="dot ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>
{%- endmacro %}

{% macro notices(notice, error) %}
  {% if notice %}<p class="notice success" role="status">{{ notice }}</p>{% endif %}
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
{% endmacro %}

{% macro forget_message() %}
<script>
  // The message is shown once: drop it from the address so a reload doesn't repeat it.
  history.replaceState(null, "", location.pathname);
</script>
{% endmacro %}
