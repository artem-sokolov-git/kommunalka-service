{% extends "base.html" %}

{% block content %}
  <h1>Домохозяйства</h1>
  {% if households %}
  <div class="grid compact">
    {% for household in households %}
    <a class="card household-card" href="{{ url_for('household_page', household_id=household.id) }}">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></span>
      <span class="grow">
        <span class="amount">{{ household.name }}</span>
        <span class="muted small" style="display: block">{{ household.address }}</span>
      </span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty">Домохозяйств пока нет. Добавьте их через <a href="/docs">API</a>.</p>
  {% endif %}
{% endblock %}
