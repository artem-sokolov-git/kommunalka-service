name: kommunalka-service

services:
  db:
    image: postgres:18.6
    container_name: ks-db
    environment:
      POSTGRES_USER: kommunalka
      POSTGRES_DB: kommunalka
      # Letters and digits only: the password is also a part of the URL of the app.
      POSTGRES_PASSWORD: ${KS_PG_PASS:?set KS_PG_PASS in the environment or .env}
    volumes:
      - pg:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -U, kommunalka, -d, kommunalka]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  app:
    # Published by .github/workflows/image.yml; `make` builds it locally (compose.build.yaml).
    image: ghcr.io/artem-sokolov-git/kommunalka-service:latest
    pull_policy: always
    container_name: ks-app
    environment:
      KS_DATABASE_URL: postgresql+psycopg://kommunalka:${KS_PG_PASS}@db:5432/kommunalka
    ports:
      - "${KOMMUNALKA_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, kommunalka.presentation.api.healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # External image: https://github.com/prodrigestivill/docker-postgres-backup-local
  backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: ks-backup
    # Runs as root: a new directory belongs to root and `postgres` could not write to it.
    volumes:
      - ../backups:/backups  # ./backups in the root of the project
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: kommunalka
      POSTGRES_USER: kommunalka
      POSTGRES_PASSWORD: ${KS_PG_PASS:?set KS_PG_PASS in the environment or .env}
      # A dump that can be restored over an existing database (see `make restore`).
      POSTGRES_EXTRA_OPTS: -Z1 --schema=public --clean --if-exists
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: Europe/Kyiv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The image checks only every 5 minutes, which makes `up --wait` wait as long.
    healthcheck:
      test: [CMD-SHELL, 'curl -f "http://localhost:$$HEALTHCHECK_PORT/" || exit 1']
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s

volumes:
  pg:
    name: kommunalka-pg
