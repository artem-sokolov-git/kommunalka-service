name: kommunalka-service

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: kommunalka-service
  volumes:
    - data:/data

services:
  api:
    <<: *app
    ports:
      - "${KOMMUNALKA_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # External service: https://github.com/artem-sokolov-git/sqlite-repo-backuper
  backup:
    image: ghcr.io/artem-sokolov-git/sqlite-repo-backuper:latest
    # The uid of the `app` user of the image: the service opens the database files.
    user: "999:999"
    volumes:
      - data:/data
    environment:
      SQLITE_DB_PATHS: /data/kommunalka.db
      GITHUB_REPO: kommunalka-sqlite-backups  # created as private if missing
      GH_TOKEN_FILE: /run/secrets/gh_token
      SCHEDULE: "@daily"
      BACKUP_ON_START: "true"
      TZ: Europe/Kyiv
    secrets:
      - gh_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  gh_token:
    file: ../secrets/gh_token

volumes:
  data:
    name: kommunalka-data
