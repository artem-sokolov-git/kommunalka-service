name: kommunalka-service

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: kommunalka-service
  volumes:
    - data:/data
  env_file:
    - path: ../.env
      required: false

services:
  api:
    <<: *app
    ports:
      - "${KOMMUNALKA_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    <<: *app
    command: ["backup", "--every", "86400"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
