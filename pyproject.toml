[project]
name = "kommunalka-service"
version = "0.1.0"
description = "Simple service for tracking utility bills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "granian>=2.8.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kommunalka"

[dependency-groups]
dev = [
    "granian[reload]>=2.8.4",
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

# Cyrillic letters that look like Latin ones: the UI and data are in Russian.
allowed-confusables = ["А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "а", "б", "е", "о", "р", "с", "у", "х"]

[tool.ruff.lint.per-file-ignores]
"src/kommunalka/infrastructure/db/migrations/versions/*" = ["E501", "F401"]  # autogenerated

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# Local one-off tooling, not part of the repository.
exclude = ["legacy"]

[tool.alembic]
script_location = "kommunalka.infrastructure.db:migrations"
file_template = "%%(rev)s_%%(slug)s"
# Run env.py on every `revision`, so revisions are numbered sequentially (see env.py).
revision_environment = true

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
